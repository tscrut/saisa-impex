<!DOCTYPE html>
<html>
<head>
    <title>Fuel Station POS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button class="settings-btn" id="btnConfig">⚙ Setup & Template</button>

    <div class="pump-casing">
        <!-- Left Side: Displays -->
        <div class="display-section">
            <div class="lcd-screen">
                <div class="lcd-label">TOTAL AMOUNT (Rs.)</div>
                <div class="lcd-value" id="displayAmount">0.00</div>
            </div>
            <div class="lcd-screen">
                <div class="lcd-label">VOLUME (Liters)</div>
                <div class="lcd-value" id="displayLiters">0.00</div>
            </div>
            <div class="lcd-screen" style="height: 60px;">
                <div class="lcd-label">UNIT PRICE (Rs./L)</div>
                <div class="lcd-value" style="font-size: 1.5em;" id="displayPrice">0.00</div>
            </div>
        </div>

        <!-- Right Side: Inputs -->
        <div class="controls-section">
            <div class="fuel-selector">
                <button class="fuel-btn btn-petrol active" id="btnPetrol" onclick="selectFuel('Petrol')">PETROL</button>
                <button class="fuel-btn btn-diesel" id="btnDiesel" onclick="selectFuel('Diesel')">DIESEL</button>
            </div>

            <div class="mode-switch" style="display:none;"></div>

            <div class="keypad">
                <!-- Row 1: SALE / LITERS Selection -->
                <button class="key mode-btn active" id="btnModeAmount" onclick="setInputMode('amount')" style="background: #27ae60; font-size:1.2em;">SALE</button>
                <div style="width:10px;"></div>
                <button class="key mode-btn" id="btnModeLiters" onclick="setInputMode('liters')" style="background: #2980b9; font-size:1.2em;">LITERS</button>
                
                <button class="key" onclick="pressKey('7')">7</button>
                <button class="key" onclick="pressKey('8')">8</button>
                <button class="key" onclick="pressKey('9')">9</button>
                <button class="key" onclick="pressKey('4')">4</button>
                <button class="key" onclick="pressKey('5')">5</button>
                <button class="key" onclick="pressKey('6')">6</button>
                <button class="key" onclick="pressKey('1')">1</button>
                <button class="key" onclick="pressKey('2')">2</button>
                <button class="key" onclick="pressKey('3')">3</button>
                <button class="key clear" onclick="pressKey('C')">CLR</button>
                <button class="key" onclick="pressKey('0')">0</button>
                <button class="key" onclick="pressKey('.')">.</button>
                <button class="key enter" onclick="printReceipt()" style="grid-column: span 3; background: #e67e22;">PRINT RECEIPT</button>
            </div>
            <!-- Payment Section -->
            <div class="payment-section" style="margin-top: 15px;">
                <label for="paymentMethod">Payment Method:</label>
                <select id="paymentMethod" style="margin-left: 5px;">
                    <option value="cash">Cash</option>
                    <option value="card">Card</option>
                </select>
                <input type="number" id="paidAmount" placeholder="Paid Amount" min="0" step="0.01" style="margin-left: 10px; display:none; width:120px;" />
                <span id="changeAmount" style="margin-left: 10px; font-weight:bold; display:none;">Change: 0.00</span>
            </div>
        </div>
    </div>

    <!-- Config Modal -->
    <div id="configModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <iframe src="editor.html" id="editorFrame" style="width:100%; height:100%; border:none;"></iframe>
        </div>
    </div>

    <!-- Hidden Printable Area -->
    <div id="printableArea"></div>

    <script src="app.js"></script>
</body>
</html>
